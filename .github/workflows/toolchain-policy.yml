name: Toolchain policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: toolchain-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Activate the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify policy and application
        run: pnpm verify

      - name: Reproduce the clean dependency graph and build
        run: pnpm rebuild:verify

      - name: Verify backlog integrity
        run: node docs/backlog/audit-backlog.mjs
